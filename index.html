<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Sakshi Beloshe — Product Manager</title>
    <meta name="description" content="Portfolio of Sakshi Beloshe, Product Manager & CS Student · MIT-WPU — ViCa (Apple WWDC 2026 Winner), Cyster, and Loan Management System." />
    <link rel="stylesheet" href="style.css" />
    <!-- Load Lucide Icons CDN. Pinned (not @latest): Lucide 1.0 dropped all brand icons
         (GitHub, LinkedIn, etc.), so an unpinned version can silently break icons on any
         future deploy. 0.525.0 has every generic glyph this app uses elsewhere (search,
         sliders-horizontal, arrow-left, x, download, moon, volume-2). The dock icons below
         don't use this CDN at all — they're hand-drawn inline SVG, so they always render
         even if this script is slow or blocked. -->
    <script src="https://unpkg.com/lucide@0.525.0"></script>
  </head>
  <body>
    <!-- Boot Screen -->
    <div id="boot-screen">
      <div class="boot-logo brand-mark" role="img" aria-label="Logo"></div>
      <div class="boot-progress-container">
        <div id="boot-progress-bar"></div>
      </div>
      <div class="boot-status">Loading portfolio…</div>
    </div>

    <!-- Desktop Environment -->
    <div id="desktop-env" class="hidden">
      <!-- Wallpaper background -->
      <div class="desktop-wallpaper"></div>

      <!-- Menu Bar -->
      <div id="menu-bar">
        <div class="menu-left">
          <div class="menu-item bold" id="apple-menu-trigger">
            <div class="brand-mark" role="img" aria-label="Apple menu"></div>
          </div>
          <div class="menu-item" data-menu="Finder">Finder</div>
          <div class="menu-item" data-menu="File">File</div>
          <div class="menu-item" data-menu="Edit">Edit</div>
          <div class="menu-item" data-menu="View">View</div>
          <div class="menu-item" data-menu="Go">Go</div>
          <div class="menu-item" data-menu="Window">Window</div>
          <div class="menu-item" data-menu="Help">Help</div>
        </div>
        <div class="menu-right">
          <div class="menu-icon" id="search-trigger" title="Search (⌘F)">
            <i data-lucide="search" style="width: 14px; height: 14px;"></i>
          </div>
          <div class="menu-icon" id="control-center-trigger" title="Control Center">
            <i data-lucide="sliders-horizontal" style="width: 14px; height: 14px;"></i>
          </div>
          <span id="menu-date"></span>
          <span id="menu-time" style="font-weight: 500;"></span>
        </div>
      </div>

      <!-- Menu Dropdowns Overlay Container -->
      <div id="dropdown-overlay" class="hidden"></div>
      <div id="active-dropdown" class="menu-dropdown hidden"></div>

      <!-- Main Desktop Area -->
      <div id="desktop-main">
        <!-- About Me Widget -->
        <div id="about-widget" class="desktop-widget" title="Click to open About Me">
          <img src="public/about_widget.jpg" alt="About Me Sketch" class="widget-photos-img" />
          <div class="widget-photos-overlay">
            <span class="widget-photos-title">About Me</span>
            <span class="widget-photos-subtitle">Click to know more</span>
          </div>
        </div>

        <!-- Desktop Folder Icons -->
        <div id="desktop-icons"></div>
      </div>

      <!-- Mobile Dashboard View -->
      <div id="mobile-dashboard" class="hidden">
        <div id="mobile-profile-widget">
          <img id="mobile-profile-photo" src="" alt="Profile" />
          <div>
            <div id="mobile-profile-name" style="font-weight: 700; font-size: 15px; color: #1a1a1a;"></div>
            <div id="mobile-profile-title" style="font-size: 12px; color: #777;"></div>
          </div>
        </div>
        <div id="mobile-folders-grid"></div>
      </div>

      <!-- Windows container -->
      <div id="windows-container"></div>

      <!-- Dock
           Icons are one consistent system: a coloured squircle per app + a small hand-drawn
           inline SVG glyph, instead of six differently-styled image files or third-party icons
           loaded from a CDN. Fully self-contained — dock always renders correctly even if a
           CDN is slow, blocked, or (as happened to Lucide's brand icons) removes an icon outright.
           Magnification-on-approach is added by dock-magnify.js. -->
      <div id="dock">
        <div class="dock-wrapper">
          <div class="dock-item" id="dock-search" aria-label="Search">
            <div class="dock-icon dock-icon--search" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.8" cy="10.8" r="6.8"/><line x1="20.5" y1="20.5" x2="15.9" y2="15.9"/></svg>
            </div>
            <div class="dock-tooltip">Search</div>
          </div>
          <div class="dock-divider"></div>
          <div class="dock-item" id="dock-mail" aria-label="Mail">
            <div class="dock-icon dock-icon--mail" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.2"/><path d="M4 7l8 6 8-6"/></svg>
            </div>
            <div class="dock-tooltip">Mail</div>
          </div>
          <div class="dock-item" id="dock-linkedin" aria-label="LinkedIn">
            <div class="dock-icon dock-icon--linkedin" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="9" width="4" height="12" rx="0.6"/><circle cx="5" cy="4.5" r="2.4"/><path d="M11 9h3.8v2.1h.05c.53-.95 1.83-2.1 3.77-2.1 4.03 0 4.78 2.5 4.78 5.76V21h-4v-5.6c0-1.34-.02-3.06-1.96-3.06-1.96 0-2.26 1.44-2.26 2.96V21h-4z"/></svg>
            </div>
            <div class="dock-tooltip">LinkedIn</div>
          </div>
          <div class="dock-item" id="dock-github" aria-label="GitHub">
            <div class="dock-icon dock-icon--github" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="8.5 8 4.5 12 8.5 16"/><polyline points="15.5 8 19.5 12 15.5 16"/><line x1="13.2" y1="6" x2="10.8" y2="18"/></svg>
            </div>
            <div class="dock-tooltip">GitHub</div>
          </div>
          <div class="dock-item" id="dock-resume" aria-label="Resume">
            <div class="dock-icon dock-icon--resume" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7l4 4V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M14 3.5V8h4"/><line x1="8.5" y1="12" x2="15.5" y2="12"/><line x1="8.5" y1="15.3" x2="15.5" y2="15.3"/><line x1="8.5" y1="18.6" x2="12.5" y2="18.6"/></svg>
            </div>
            <div class="dock-tooltip">Resume</div>
          </div>
          <div class="dock-item" id="dock-terminal" aria-label="Terminal">
            <div class="dock-icon dock-icon--terminal" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.2"/><polyline points="7 9.5 10.5 12.3 7 15"/><line x1="12.5" y1="15" x2="16.5" y2="15"/></svg>
            </div>
            <div class="dock-tooltip">Terminal</div>
            <div id="terminal-dock-dot" class="dock-item-dot hidden"></div>
          </div>

          <!-- Dynamic Open / Minimized Windows Split -->
          <div id="dock-minimized-divider" class="dock-divider hidden"></div>
          <div id="dock-minimized-items" style="display: flex; gap: 12px; align-items: flex-end;"></div>
        </div>
      </div>
    </div>

    <!-- Spotlight Search Overlay -->
    <div id="spotlight-search" class="hidden">
      <div class="spotlight-card">
        <div class="spotlight-header">
          <i data-lucide="search" style="color: #888; width: 18px; height: 18px;"></i>
          <input type="text" id="spotlight-input" placeholder="Search projects, about, contact…" autocomplete="off" />
          <div id="spotlight-close" class="close-btn">
            <i data-lucide="x" style="color: #999; width: 16px; height: 16px;"></i>
          </div>
        </div>
        <div id="spotlight-results"></div>
      </div>
    </div>

    <!-- Control Center Panel -->
    <div id="control-center-panel" class="hidden">
      <div class="cc-section">
        <div class="cc-section-title">Wallpaper</div>
        <div class="cc-wallpaper-grid" id="cc-wallpaper-grid"></div>
      </div>
      <div class="cc-divider"></div>
      <div class="cc-section">
        <div class="cc-section-title">Sound Effects</div>
        <div class="cc-toggle-row">
          <span class="cc-toggle-label"><i data-lucide="volume-2" style="width:13px;height:13px;margin-right:6px;"></i>UI Sounds</span>
          <div class="cc-toggle" id="cc-sound-toggle">
            <div class="cc-toggle-knob" id="cc-sound-knob"></div>
          </div>
        </div>
      </div>
      <div class="cc-divider"></div>
      <div class="cc-section">
        <div class="cc-section-title">Window Style</div>
        <div class="cc-toggle-row">
          <span class="cc-toggle-label"><i data-lucide="moon" style="width:13px;height:13px;margin-right:6px;"></i>Dark Windows</span>
          <div class="cc-toggle" id="cc-dark-toggle">
            <div class="cc-toggle-knob" id="cc-dark-knob"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="control-center-overlay" class="hidden"></div>

    <!-- Resume Viewer Overlay -->
    <div id="resume-viewer" class="hidden">
      <div class="resume-header">
        <div id="resume-back" class="resume-back-btn">
          <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i> Back
        </div>
        <div class="resume-title">Resume.pdf</div>
        <a id="resume-download" href="" download class="resume-download-btn">
          <i data-lucide="download" style="width: 14px; height: 14px;"></i> Download
        </a>
      </div>
      <div class="resume-body">
        <div id="resume-scroll">
          <div id="resume-status" role="status"></div>
          <div id="resume-pages"></div>
        </div>
      </div>
    </div>

    <!-- Application Script -->
    <script type="module" src="resume-viewer.js"></script>
    <script src="main.js"></script>
    <script src="dock-magnify.js"></script>
  </body>
</html>
